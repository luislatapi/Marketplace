# Infraestructura local para desarrollo. En producción: RDS/Neon, ElastiCache, Meilisearch Cloud, S3 + CloudFront.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mkt
      POSTGRES_PASSWORD: mkt
      POSTGRES_DB: marketplace
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  meilisearch:
    image: getmeili/meilisearch:v1.10
    environment:
      MEILI_MASTER_KEY: dev-master-key
    ports: ["7700:7700"]

  # MinIO emula S3 en local: un bucket público (CDN) y una bóveda privada separada.
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  minio-setup:
    image: minio/mc
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minio minio12345;
      mc mb -p local/mkt-public-media local/mkt-quarantine local/mkt-vault local/mkt-private-docs;
      mc anonymous set download local/mkt-public-media;
      mc version enable local/mkt-vault;
      exit 0;
      "

volumes:
  pgdata:
  miniodata:
